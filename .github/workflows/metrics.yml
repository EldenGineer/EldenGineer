name: Metricas (commits + linguagens)

on:
  # Atualiza todo dia as 3h (UTC)
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token pessoal (PAT) — precisa ser criado e salvo como secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Manaus

          # --- Gráfico de linguagens mais usadas ---
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html

          # --- Calendário isométrico (blocos de commits em 3D) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Hábitos de commits: desligado (plugin gerava "Unexpected error" na imagem) ---
          plugin_habits: no

          # --- Estilo: texto cinza legível nos temas claro e escuro, destaques em azul ---
          extras_css: |
            svg { color: #8b949e !important; }
            h1, h2, h3 { color: #2f81f7 !important; }
            h2 { font-weight: 600 !important; }
            .field svg { fill: #2f81f7 !important; }
            .field.language.details small, footer { color: #8b949e !important; }
