name: Metricas (commits + linguagens)

on:
  # Atualiza todo dia as 3h (UTC)
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # O CSS (com as fontes embutidas) fica em assets/metrics.css e e lido aqui
      - uses: actions/checkout@v4

      - name: Ler CSS das metricas
        id: css
        run: |
          {
            echo 'css<<CSS_EOF'
            cat assets/metrics.css
            echo 'CSS_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: lowlighter/metrics@latest
        with:
          # Token pessoal (PAT) — precisa ser criado e salvo como secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          # Sem community e repositories: eram so contadores zerados
          base: header, activity, metadata
          config_timezone: America/Manaus

          # --- Gráfico de linguagens mais usadas ---
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # HTML distorcia o gráfico; TypeScript, Java, JavaScript e CSS vêm dos projetos antigos de mobile
          plugin_languages_ignored: html, typescript, java, javascript, css

          # --- Calendário isométrico (blocos de commits em 3D) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Hábitos de commits: desligado (plugin gerava "Unexpected error" na imagem) ---
          plugin_habits: no

          # --- Estilo placa de máquina (latão e esmalte), mesmo do banner ---
          extras_css: ${{ steps.css.outputs.css }}
